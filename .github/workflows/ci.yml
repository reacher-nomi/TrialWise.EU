# Runs on every push and pull request. A red ❌ means: don't merge yet.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend – lint & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen           # exact versions from uv.lock
      - run: uv run ruff check .        # code errors & style
      - run: uv run ruff format --check .
      - run: uv run pytest -v           # tests (use SQLite, no DB server needed)

  frontend:
    name: Frontend – type-check & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build              # fails if TypeScript finds errors

  docker:
    name: Docker – images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]          # only if the code checks passed
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f docker-compose.prod.yml build
        env:
          DB_PASSWORD: ci-only-dummy
